<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Number Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="confetti-container"></div>


    <!-- START SCREEN -->
    <div id="start-screen" class="start-screen">

        <div class="language-switch">

            <button id="english-btn" class="active-language">
                English
            </button>

            <button id="bangla-btn">
                বাংলা
            </button>

        </div>


        <h1 id="start-title">
            🎮 Kids Number Game
        </h1>


        <p id="start-subtitle">
            Learn Numbers from 1 to 50
        </p>


        <!-- GAME MODE -->
        <div class="mode-select">

            <button id="number-mode" class="active-mode">
                🔢 Number
            </button>

            <button id="addition-mode">
                ➕ Addition
            </button>

            <button id="subtraction-mode">
                ➖ Subtraction
            </button>

        </div>
        <div class="level-select">

    <p id="choose-level-text">🎯 Choose Level</p>

    <button id="level1-btn" class="active-level">
        Level 1
    </button>

    <button id="level2-btn" disabled>
        🔒 Level 2
    </button>

    <button id="level3-btn" disabled>
        🔒 Level 3
    </button>

</div>


        <button id="start-btn">
            ▶ Start Game
        </button>

    </div>



    <!-- GAME SCREEN -->
    <div
        class="game-container"
        id="game-container"
        style="display: none;"
    >

        <h1 id="game-title">
            🎮 Kids Number Game
        </h1>


        <p id="question-text">
            Which number is this?
        </p>


        <div id="question">
            5
        </div>

        <button id="repeat-voice-btn" class="repeat-voice-btn">
    🔊 Repeat
</button>

        <div class="options">

            <button>3</button>
            <button>5</button>
            <button>7</button>
            <button>9</button>

        </div>


        <div id="result"></div>


        <p>

            ⭐
            <span id="score-label">
                Score
            </span>:

            <span id="score">
                0
            </span>


            &nbsp;&nbsp;&nbsp;


            🔥
            <span id="streak-label">
                Streak
            </span>:

            <span id="streak">
                0
            </span>

        </p>


        <p>

            🎯
            <span id="level-label">
                Level
            </span>:

            <span id="level">
                1
            </span>

        </p>


        <div class="game-actions">

            <button id="home-btn">
                🏠 Home
            </button>

            <button id="restart-btn">
                🔄 Restart
            </button>

        </div>

    </div>

    <div id="level-popup" class="level-popup">

    <div class="level-popup-box">

        <h2 id="popup-title">
            🎉 Level Unlocked!
        </h2>

        <p id="popup-message"></p>

        <div class="popup-buttons">

            <button id="next-level-btn">
                ▶ Next Level
            </button>

            <button id="repeat-level-btn">
                🔄 Play Again
            </button>

        </div>

    </div>

</div>

    <script src="script.js"></script>

</body>

</html>
